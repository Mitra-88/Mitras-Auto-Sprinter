name: ✨ Feature request
description: got an idea? tell me what you'd want the mod to do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ideas are always welcome, plenty of stuff in this mod started from just messing around with it and thinking "this could work better." small heads up tho: this is a tiny client-side auto sprint mod made by one guy, so ideas like "track my skyblock coins" probably won't happen, but "make the hud do X" absolutely might.

  - type: textarea
    id: idea
    attributes:
      label: what's your idea?
      description: a sentence or two, like you'd explain it to a friend in the discord call.
      placeholder: show the sprint state as a small icon instead of text.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: why do you want it?
      description: what would it make easier? "it'd be cool" is honestly a valid reason too, but a real use case hits different.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: how should it work?
      description: |
        if you have something in mind: what does the hud show, what keybinds, what goes in the config?
        no idea? no stress - figuring that out is half the fun.
      placeholder: press H to hide the hud. it should remember between restarts.

  - type: checkboxes
    id: checklist
    attributes:
      label: quick checklist
      options:
        - label: i checked the existing (and closed) issues and this isn't already suggested
          required: true
        - label: this is about the mod, not a vanilla minecraft thing
          required: true
