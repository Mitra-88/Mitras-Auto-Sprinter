name: ✨ Feature request
description: Got an idea? Tell me what you'd like the mod to do.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are always welcome plenty of stuff in this mod started from just playing around and thinking "this could work better".
        This is a tiny client‑side auto‑sprint mod made by one person. Huge ideas probably won't happen.

  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: A sentence or two, like you'd explain it to a friend.
      placeholder: Show the sprint state as a small icon instead of text.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why do you want it?
      description: What would it make easier? "It'd be cool" is a valid reason too, but a real use case helps me prioritise.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How should it work?
      description: |
        The details, if you have them: keybinds, config options, exact HUD wording/placement.
      placeholder: A keybind (default H) to toggle it, saved in the config so it persists between restarts.

  - type: checkboxes
    id: checklist
    attributes:
      label: Quick checklist
      options:
        - label: I checked the existing (and closed) issues and this isn't already suggested.
          required: true
        - label: This is about the mod, not a vanilla Minecraft thing.
          required: true
