name: 🐞 Bug report
description: Something broke, looks wrong, or the HUD is acting up.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!
        Quick heads up: vanilla Minecraft has a few sprinting quirks of its own. For example, if you start sneaking while already sprinting, you keep sprinting. That's the game, not the mod (still true as of 26.2).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Tell me what you saw, and what you expected instead.
        Screenshots or a short clip are super helpful, just drag & drop them right into this box.
      placeholder: |
        The HUD said "Sprint OFF - Too Hungry", but my hunger bar was full.
        I expected it to say "Sprint ON".
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does this happen?
      options:
        - Singleplayer
        - On a server (multiplayer)
        - Both
    validations:
      required: true

  - type: dropdown
    id: vanilla
    attributes:
      label: Does the same thing happen without the mod?
      description: If you can, test with the mod removed, it saves me a lot of time.
      options:
        - "No, only with the mod"
        - "Yes, vanilla does it too"
        - Didn't check
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Please provide all four. The mod version is in the .jar filename in your `mods` folder.
      placeholder: |
        Mitra's Auto Sprinter: 1.7.0
        Minecraft: 26.2
        Fabric Loader: 0.19.3
        Fabric API: 0.160.0+26.2
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Installed Mod(s) & Version(s)?
      description: |
        List them if you can. Movement, sprint, and HUD mods are especially interesting.
      placeholder: |
        sodium-fabric-0.9.2+mc26.2.jar
        lithium-fabric-0.25.3+mc26.2.jar
        entityculling-fabric-1.10.5-mc26.2.jar
        ImmediatelyFast-Fabric-1.16.5+26.2.jar

  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: |
        Upload your log to https://mclo.gs/ and paste the link here.
        Extra useful if something crashed or the HUD disappeared.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Exact steps are gold. "Press K, walk forward, sneak, jump" is much better than "it happens sometimes".
        Also tell me if it happens every time or just occasionally.
        A screenshot or short clip helps a LOT more than words alone (upload it somewhere and link it here), just please, not 144p 🙏😭
      placeholder: |
        1. Press K to turn the mod on.
        2. Walk forward into shallow water.
        3. HUD shows the wrong state (happens every time).
    validations:
      required: true
