name: Build Mitra's Auto Sprinter

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@a78ec39f1243adc9be41d35a49593a4c665a604c
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f9f39a915cd0648dca917c72880100a59df96944

      - name: Read metadata
        id: meta
        run: |
          grep -E '^(version|minecraft_version|releaseDevBuilds|loader_version|fabric_api_version|fzzy_config_version|loom_version)=' gradle.properties >> "$GITHUB_OUTPUT"
          GRADLE_VERSION="$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-[a-z]*\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          echo "gradle_version=${GRADLE_VERSION:-unknown}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Mitra's-Auto-Sprinter-${{ steps.sha.outputs.short_sha }}-master
          path: build/libs/

      - name: Generate release notes
        if: steps.meta.outputs.releaseDevBuilds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          MC_VERSION: ${{ steps.meta.outputs.minecraft_version }}
          BASE_VERSION: ${{ steps.meta.outputs.version }}
          FABRIC_LOADER: ${{ steps.meta.outputs.loader_version }}
          FABRIC_API: ${{ steps.meta.outputs.fabric_api_version }}
          FZZY_CONFIG: ${{ steps.meta.outputs.fzzy_config_version }}
          LOOM_VERSION: ${{ steps.meta.outputs.loom_version }}
          GRADLE_VERSION: ${{ steps.meta.outputs.gradle_version }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u +'%Y-%m-%d %H:%M UTC')"

          CHANGES="$(gh api "repos/${REPO}/compare/nightly...${GITHUB_SHA}" --jq '[.commits[] | select((.parents | length) == 1)] | reverse | .[:20][] | "* " + (.commit.message | split("\n")[0]) + " (`" + .sha[0:7] + "`")" 2>/dev/null || true)"
          if [ -z "$CHANGES" ]; then
            CHANGES="* No changes since last nightly"
          fi

          HASHES=""
          for f in build/libs/*.jar; do
            name="$(basename "$f")"
            sha256="$(sha256sum "$f" | awk '{print $1}')"
            sha512="$(sha512sum "$f" | awk '{print $1}')"
            HASHES="${HASHES}* \`${name}\`\n  - SHA-256: \`${sha256}\`\n  - SHA-512: \`${sha512}\`\n"
          done

          {
            echo "**Automated Nightly Build**"
            echo "* **Minecraft Version:** \`${MC_VERSION}\`"
            echo "* **Base Version:** \`${BASE_VERSION}\`"
            echo "* **Build Number:** #${RUN_NUMBER}"
            echo "* **Branch:** [\`${BRANCH}\`](https://github.com/${REPO}/tree/${GITHUB_SHA})"
            echo "* **Commit:** [\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${GITHUB_SHA})"
            echo "* **Built on:** ${BUILT_AT}"
            echo "* **Java Runtime:** Java 25 (Zulu)"
            echo "* **Gradle Version:** ${GRADLE_VERSION}"
            echo ""
            echo "## 📦 Dependencies"
            echo "| Dependency | Version |"
            echo "|------------|---------|"
            echo "| Fabric Loader | \`${FABRIC_LOADER}\` |"
            echo "| Fabric API | \`${FABRIC_API}\` |"
            echo "| Fzzy Config | \`${FZZY_CONFIG}\` |"
            echo "| Loom | \`${LOOM_VERSION}\` |"
            echo "| Gradle | \`${GRADLE_VERSION}\` |"
            echo ""
            echo "## 📝 Recent Changes"
            printf '%s\n' "$CHANGES"
            echo ""
            echo "## 🔐 File Hashes"
            printf '%b\n' "$HASHES"
            echo "> [!CAUTION]"
            echo "> This build is automatically generated and unreleased. Features may be incomplete, unstable, or potentially breaking. Backup your configs before testing."
          } > release_notes.md

          cat release_notes.md

      - name: Update nightly pre-release
        if: steps.meta.outputs.releaseDevBuilds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          MC_VERSION: ${{ steps.meta.outputs.minecraft_version }}
        shell: bash
        run: |
          TAG="nightly"
          TITLE="Nightly (mc${MC_VERSION}, build #${RUN_NUMBER})"

          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" build/libs/*.jar --clobber -R "$REPO"
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes-file release_notes.md -R "$REPO"
          else
            gh release create "$TAG" build/libs/*.jar --prerelease --title "$TITLE" --notes-file release_notes.md --target "$SHA" -R "$REPO"
          fi
