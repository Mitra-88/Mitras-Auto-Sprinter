name: Build Mod

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Cache Gradle wrapper distributions
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create dev pre-release
        if: steps.meta.outputs.release_dev_builds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.meta.outputs.version }}-mc${{ steps.meta.outputs.mc }}-dev.${{ github.run_number }}"
          gh release create "$TAG" build/libs/*.jar \
            --prerelease \
            --title "Mitra's Auto Sprinter ${{ steps.meta.outputs.version }}-mc${{ steps.meta.outputs.mc }} (dev build #${{ github.run_number }})" \
            --notes "Automated dev build from commit ${{ steps.sha.outputs.short_sha }}. may be unstable"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Mitra's-Auto-Sprinter-${{ steps.sha.outputs.short_sha }}-master
          path: build/libs/
