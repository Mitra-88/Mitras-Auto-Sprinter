name: Build Mod

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Cache Gradle wrapper distributions
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read metadata
        id: meta
        run: |
          grep -E '^(version|minecraft_version|releaseDevBuilds)=' gradle.properties >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Mitra's-Auto-Sprinter-${{ steps.sha.outputs.short_sha }}-master
          path: build/libs/

      - name: Update nightly pre-release
        if: steps.meta.outputs.releaseDevBuilds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="nightly"

          gh release delete "$TAG" --yes --cleanup-tag || true

          gh release create "$TAG" build/libs/*.jar \
            --prerelease \
            --title "Nightly (mc${{ steps.meta.outputs.minecraft_version }}, build #${{ github.run_number }})" \
            --notes "Automated nightly build from commit ${{ steps.sha.outputs.short_sha }} on \`${{ github.ref_name }}\`. Version base: ${{ steps.meta.outputs.version }}. May be unstable." \
            --target "${{ github.sha }}"