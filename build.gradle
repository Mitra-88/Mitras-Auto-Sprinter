import java.util.zip.ZipFile

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'idea'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mitrasautosprinter" {
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven {
		name = "FzzyMaven"
		url = uri("https://maven.fzzyhmstrs.me/")
	}
	maven {
		name = "TerraformersMC"
		url = uri("https://maven.terraformersmc.com/releases/")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}"
}

tasks.register('extractAgentSources') {
	group = 'documentation'
	description = 'Extracts dependency + Minecraft source jars into agent_sources/src (skips all disk writes if nothing changed).'

	def outputDir = layout.projectDirectory.dir('agent_sources/src').asFile
	def stampFile = new File(outputDir, '.stamp')
	def sourceJars = configurations.compileClasspath.incoming.artifactView {
		withVariantReselection()
		lenient = true
		attributes {
			attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
			attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.DOCUMENTATION))
			attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
			attribute(DocsType.DOCS_TYPE_ATTRIBUTE, objects.named(DocsType, DocsType.SOURCES))
		}
	}.files
	def mcSourceJars = [
			fileTree(layout.projectDirectory.dir('.gradle/loom-cache/minecraftMaven')) { include "**/*${project.minecraft_version}-sources.jar" },
			fileTree(new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/minecraftMaven')) { include "**/*${project.minecraft_version}-sources.jar" },
	]
	outputs.dir(outputDir)
	outputs.upToDateWhen { false }
	dependsOn tasks.named('genSources')

	doLast {
		def jars = (sourceJars.files + (mcSourceJars.collectMany { it.files } as Collection<File>))
				.findAll { it.name.endsWith('-sources.jar') }
				.unique { it.absolutePath }
				.sort { it.name }
		def fingerprint = jars.collect { "${it.absolutePath}:${it.length()}" }.join('\n')
		if (stampFile.exists() && stampFile.text == fingerprint) {
			println "extractAgentSources: up to date (${jars.size()} jars), nothing written"
			return
		}
		outputDir.deleteDir()
		outputDir.mkdirs()
		def writtenPaths = new HashSet<String>()
		jars.each { jar ->
			new ZipFile(jar).withCloseable { zip ->
				zip.entries().each { entry ->
					if (entry.isDirectory() || !(entry.name.endsWith('.java') || entry.name.endsWith('.kt'))) {
						return
					}
					if (!writtenPaths.add(entry.name)) {
						return
					}
					def target = new File(outputDir, entry.name)
					if (!target.canonicalPath.startsWith(outputDir.canonicalPath + File.separator)) {
						return
					}
					target.parentFile.mkdirs()
					target.withOutputStream { out ->
						out << zip.getInputStream(entry)
					}
				}
			}
		}
		stampFile.text = fingerprint
		println "extractAgentSources: extracted ${jars.size()} source jars into ${outputDir}"
	}
}

def expandProps = [
		"version": project.version.toString(),
		"minecraft_version": project.minecraft_version.toString(),
		"loader_version": project.loader_version.toString(),
		"java_version": project.java_version.toString(),
		"fabric_api_version": project.fabric_api_version.toString(),
		"fzzy_config_version": project.fzzy_config_version.toString(),
]

tasks.withType(ProcessResources).configureEach {
	inputs.properties(expandProps)

	filesMatching("fabric.mod.json") {
		expand(expandProps)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

idea {
	module {
		excludeDirs += file('agent_sources')
	}
}

jar {
	archiveVersion = "${project.version}-fabric-mc${project.minecraft_version}"

	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
